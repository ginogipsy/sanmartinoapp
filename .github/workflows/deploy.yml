name: Deploy APK

on:
  workflow_call:
    inputs:
      ref_name:
        required: true
        type: string
      ref_type:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    name: Approve deploy
    if: github.event_name != 'workflow_dispatch' && github.ref_name != 'master' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name != 'workflow_dispatch' && github.ref_name != 'master' && github.ref_type != 'tag') && 'san-martino-registry' || '' }}
    steps:
      - name: Approve
        run: echo "Deploy approved"

  publish-apk:
    name: Publish APK
    needs: gate
    if: always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Compute tags
        id: tags
        run: |
          REF_NAME="${{ inputs.ref_name || github.ref_name }}"
          SLUG=$(echo "$REF_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          
          if [ "${{ inputs.ref_type || github.ref_type }}" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ "$REF_NAME" = "master" ]; then
            TAG="latest"
          else
            TAG="$SLUG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release (Placeholder for Nexus)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tags.outputs.tag }}-apk
          files: app/build/outputs/apk/debug/*.apk
          name: Build Artifact - ${{ steps.tags.outputs.tag }}
          draft: false
          prerelease: true
